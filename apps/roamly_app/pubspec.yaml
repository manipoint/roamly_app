name: roamly_app
description: Roamly AI travel assistant mobile application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1
  roamly_auth:
    path: ../../packages/roamly_auth
  roamly_logging:
    path: ../../packages/roamly_logging
  roamly_networking:
    path: ../../packages/roamly_networking
  roamly_ui:
    path: ../../packages/roamly_ui
  roamly_core:
    path: ../../packages/roamly_core
  map_launcher: ^6.0.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/travel_style/
